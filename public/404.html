<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      // SPA GitHub Pages redirect workaround
      // Source: https://github.com/rafgraph/spa-github-pages
      // Encodes the requested path into a query string and redirects to the
      // real domain root, where index.html's counterpart script decodes it
      // back into the original URL via history.replaceState before React
      // Router mounts. pathSegmentsToKeep is 0 because this repo is a user
      // page (wilsonnguyen257.github.io), served from the domain root.
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    Redirecting…
  </body>
</html>
